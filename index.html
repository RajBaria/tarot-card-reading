    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mystic: {
                            900: '#1a0b2e',
                            800: '#2d1b4e',
                            700: '#432c7a',
                            gold: '#d4af37',
                            lightGold: '#f3e5ab'

                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],

                    }
                }

    <style>
        body {
            background: radial-gradient(circle at center, #2d1b4e 0%, #0a0410 100%);
            color: #f3e5ab;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            animation: twinkle 5s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 0.4; }
        }

        /* 3D Card Flip CSS */
        .perspective { perspective: 1000px; }
        
        .card-inner {
            position: relative;
            width: 100%; height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-radius: 0.75rem;
        }
        
        .card-container.flipped .card-inner { transform: rotateY(180deg); }
        
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            border: 2px solid #d4af37;
        }
        
        .card-back {
            background: linear-gradient(135deg, #1a0b2e 0%, #432c7a 100%);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        .card-back::after {
            content: '✧'; font-size: 3rem; color: rgba(212, 175, 55, 0.5); position: absolute;
        }
        .card-back::before {
            content: ''; position: absolute; inset: 6px;
            border: 1px dashed #d4af37; border-radius: 0.5rem; opacity: 0.5;
        }
        
        .card-front {
            background: #fdfbf7; color: #1a0b2e;
            transform: rotateY(180deg); display: flex; flex-direction: column;
        }

        .card-content-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100%; padding: 0.5rem; transition: transform 0.5s;
        }
        
        .card-container.reversed-card .card-content-wrapper { transform: rotateZ(180deg); }

        .btn-mystic {
            background: linear-gradient(45deg, #432c7a, #1a0b2e);
            border: 1px solid #d4af37; color: #f3e5ab; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            cursor: pointer;
        }
        .btn-mystic:hover {
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.6);
            transform: translateY(-2px);
            background: linear-gradient(45deg, #1a0b2e, #432c7a);
        }

        .fade-in { animation: fadeIn 0.8s forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .hidden-view { display: none !important; }

        /* Fanned Deck Styles */
        .spread-container {
            position: relative;
            height: 200px; width: 100%; max-width: 800px;
            margin: 0 auto; display: flex; justify-content: center; align-items: flex-end;
            perspective: 1000px;
        }
        .spread-card {
            position: absolute;
            width: 70px; height: 110px;
            transform-origin: bottom center;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            box-shadow: -2px 0px 10px rgba(0,0,0,0.5);
        }
        .spread-card:hover {
            transform: translateY(-30px) scale(1.15) !important;
            z-index: 100 !important;
            box-shadow: 0px 15px 25px rgba(212, 175, 55, 0.4);
        }
        .spread-card.drawn {
            opacity: 0; pointer-events: none; transform: translateY(-100px) scale(0.5) !important;
        }

        /* Shuffle Animation */
        .shuffling .spread-card {
            transform: translate(0, 0) rotate(0deg) !important;
            opacity: 0.8;
        }

        /* Custom Scrollbar for Gallery */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a0b2e; }
        ::-webkit-scrollbar-thumb { background: #432c7a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
    </style>
</head>

                }

                meaningsList.innerHTML = '';
                showResults(true);
            }

            return t.posInsight;

            readingView.classList.remove('hidden-view');
            
            updateInstruction();
            setupSlots(spreadCount);
            resultsContainer.classList.add('hidden-view');
            meaningsList.innerHTML = '';
            deckActions.classList.remove('hidden-view');
            
            initializeDeck();
        }

        function updateInstruction() {
            const t = uiStrings[currentLang];
            if(cardsRemaining > 0) {
                instructionText.innerHTML = t.drawInstruction.replace('{n}', cardsRemaining);
            } else {
                instructionText.innerHTML = t.revealing;
            }
        }

        function setupSlots(count) {
            slotsContainer.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const label = getPositionName(i, count);
                const slotHTML = `
                    <div class="flex flex-col items-center">
                        <span id="slot-label-${i}" class="text-sm text-mystic-lightGold mb-2 font-display tracking-widest uppercase opacity-70">${label}</span>
                        <div id="slot-${i}" class="w-24 sm:w-32 h-36 sm:h-48 border-2 border-dashed border-mystic-700 rounded-xl bg-mystic-900/30 flex items-center justify-center relative perspective">
                        </div>
                    </div>
                `;
                slotsContainer.insertAdjacentHTML('beforeend', slotHTML);
            }
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initializeDeck() {
            deckOrder = shuffleArray([...cardsData]); // Copy and shuffle
            renderFannedDeck();
        }

        function renderFannedDeck() {
            spreadContainer.innerHTML = '';
            const total = deckOrder.length;
            
            // Generate DOM elements
            deckOrder.forEach((card, index) => {
                const el = document.createElement('div');
                el.className = 'spread-card card-inner';
                
                // Card Back UI
                el.innerHTML = `
                    <div class="card-back shadow-md border-mystic-gold/80" style="border-width: 1px;">
                        <span class="text-xl text-mystic-gold opacity-50 absolute">✧</span>
                    </div>
                `;
                
                // Calculate position for a fanned arc of 78 cards
                let angle = -45 + (90 / (total - 1)) * index;
                let maxSpread = window.innerWidth < 600 ? 160 : 350; 
                let xOffset = -maxSpread + ((maxSpread * 2) / (total - 1)) * index;
                let normalizedX = (index / (total - 1)) * 2 - 1;
                let yOffset = (normalizedX * normalizedX) * 40; 

                el.style.transform = `translateX(${xOffset}px) translateY(${yOffset}px) rotate(${angle}deg)`;
                el.dataset.baseTransform = el.style.transform;
                el.dataset.cardId = card.id;
                
                el.onclick = () => pickCardFromSpread(el, card);
                spreadContainer.appendChild(el);
            });
        }

        function shuffleDeckAnimation() {
            if (cardsRemaining === 0) return;
            
            spreadContainer.classList.add('shuffling');
            const t = uiStrings[currentLang];
            document.getElementById('ui-shuffleBtn').innerText = t.title === "रહસ્યમય ટેરોટ" ? "પીસી રહ્યા છીએ..." : "Shuffling...";

            setTimeout(() => {
                deckOrder = shuffleArray([...deckOrder]);
                renderFannedDeck(); // Re-render in new order but still in shuffling state
                
                setTimeout(() => {
                    spreadContainer.classList.remove('shuffling');
                    document.getElementById('ui-shuffleBtn').innerText = t.shuffleBtn;
                }, 50); // Small delay to allow CSS to register the new transform
            }, 500); // Wait for them to gather to center
        }

        function pickCardFromSpread(cardElement, cardData) {
            if (cardsRemaining === 0) return;
            if (cardElement.classList.contains('drawn')) return;

            // Mark visually drawn from spread
            cardElement.classList.add('drawn');

            let isReversed = Math.random() < 0.2; // 20% chance of reversal
            let slotIndex = currentSpread - cardsRemaining;
            
            drawnDeck.push({
                card: cardData,
                reversed: isReversed,
                slotIndex: slotIndex
            });

            cardsRemaining--;
            updateInstruction();

            renderCardInSlot(slotIndex, cardData, isReversed);

            if (cardsRemaining === 0) {
                deckActions.classList.add('hidden-view');
                setTimeout(() => showResults(false), 1200);
            }
        }

        function renderCardInSlot(slotIndex, cardData, isReversed) {
            const slot = document.getElementById(`slot-${slotIndex}`);
            slot.classList.remove('border-dashed', 'border-mystic-700', 'bg-mystic-900/30', 'border-2');
            
            const identifier = cardData.id < 22 ? (cardData.id === 0 ? '0' : romanize(cardData.id)) : '';
            const cardName = cardData[currentLang].n.split(' (')[0];
            const svgIcon = cardSVGs[cardData.id];

            const cardHTML = `
                <div class="card-container w-full h-full ${isReversed ? 'reversed-card' : ''}">
                    <div class="card-inner" style="transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
                        <div class="card-back"></div>
                        <div class="card-front relative p-1 sm:p-2 overflow-hidden bg-white rounded-xl">
                            <div class="absolute inset-1 sm:inset-2 border border-mystic-900/20 rounded-lg pointer-events-none z-20"></div>
                            
                            <div class="card-content-wrapper relative z-0 h-full flex flex-col items-center justify-between">
                                <div id="slot-name-${slotIndex}" class="text-[0.55rem] sm:text-[0.65rem] leading-tight font-display font-bold text-mystic-900 mb-1 uppercase text-center min-h-[1.5rem] sm:min-h-[2rem] flex items-center justify-center border-b border-gray-300 w-full pb-1">
                                    ${cardName}
                                </div>
                                <div class="w-12 h-12 sm:w-16 sm:h-16 my-auto text-mystic-900 flex items-center justify-center">
                                    ${svgIcon}
                                </div>
                                <div class="text-[0.55rem] sm:text-[0.65rem] text-mystic-700 mt-1 text-center uppercase tracking-wider font-bold">
                                    ${identifier}
                                </div>
                            </div>
                            
                            <img src="https://raw.githubusercontent.com/RajBaria/tarot-card-reading/main/card_${cardData.id}.img" class="absolute inset-0 w-full h-full object-cover z-10 rounded-lg" onerror="this.style.display='none'" alt="Tarot Card">
                        </div>
                    </div>
                </div>
            `;
            
            slot.innerHTML = cardHTML;

            // Trigger flip animation after small delay
            setTimeout(() => {
                slot.querySelector('.card-container').classList.add('flipped');
            }, 100);
        }

        function romanize(num) {
            if (isNaN(num)) return NaN;
            let digits = String(+num).split(""),
                key = ["","C","CC","CCC","CD","D","DC","DCC","DCCC","CM",
                       "","X","XX","XXX","XL","L","LX","LXX","LXXX","XC",
                       "","I","II","III","IV","V","VI","VII","VIII","IX"],
                roman = "", i = 3;
            while (i--) roman = (key[+digits.pop() + (i * 10)] || "") + roman;
            return Array(+digits.join("") + 1).join("M") + roman;
        }

        function showResults(skipScroll) {
            const t = uiStrings[currentLang];
            instructionText.innerHTML = t.scrollDown;
            instructionText.classList.remove('animate-pulse');
            
            resultsContainer.classList.remove('hidden-view');
            resultsContainer.classList.add('fade-in');

            drawnDeck.forEach((drawn) => {
                const cData = drawn.card[currentLang];
                const posName = getPositionName(drawn.slotIndex, currentSpread);
                
                const stateText = drawn.reversed ? 
                    `<span class="text-red-400 text-sm sm:text-base ml-2">${t.reversed}</span>` : 
                    `<span class="text-green-400 text-sm sm:text-base ml-2">${t.upright}</span>`;
                
                const keywords = drawn.reversed ? cData.r : cData.u;
                const svgIcon = cardSVGs[drawn.card.id];
                
                const meaningHTML = `
                    <div class="bg-mystic-900/50 p-4 sm:p-5 rounded-xl border border-mystic-700/50">
                        <div class="flex items-center gap-3 border-b border-mystic-700 pb-3 mb-3">
                            <div class="w-14 h-20 bg-white rounded border border-mystic-gold shrink-0 relative overflow-hidden">
                                <div class="absolute inset-0 p-1 flex items-center justify-center">${svgIcon}</div>
                                <img src="https://raw.githubusercontent.com/RajBaria/tarot-card-reading/main/card_${drawn.card.id}.img" class="absolute inset-0 w-full h-full object-cover z-10" onerror="this.style.display='none'" alt="Card">
                            </div>
                            <div>
                                <h4 class="text-mystic-lightGold text-xs uppercase tracking-widest">${posName}</h4>
                                <h3 class="text-lg sm:text-2xl font-display font-bold text-white">${cData.n} ${stateText}</h3>
                            </div>
                        </div>
                        <p class="text-gray-300 italic mb-2 text-sm sm:text-base">"${cData.d}"</p>
                        <p class="text-mystic-gold font-semibold text-sm sm:text-base">
                            ${t.keyMeaning} <span class="text-gray-200 font-normal">${keywords}</span>
                        </p>
                    </div>
                `;
                meaningsList.insertAdjacentHTML('beforeend', meaningHTML);
            });
            
            if(!skipScroll) {
                setTimeout(() => {
                    resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
        }

        function resetGame() {
            readingView.classList.add('hidden-view');
            menuView.classList.remove('hidden-view');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize correctly on page load
        window.onload = function() {
            changeLanguage(document.getElementById('lang-select').value);
        }
    </script>
</body>
</html>
